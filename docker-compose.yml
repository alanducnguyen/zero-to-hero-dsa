services:
  # Bản build sẵn, phục vụ bằng nginx: docker compose up
  web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev server có hot reload: docker compose --profile dev up
  dev:
    image: node:22-alpine
    profiles: [dev]
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
